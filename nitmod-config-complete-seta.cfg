// Note: If you enable seta g_floodprotect, make sure you set a value for seta g_floodthreshold

seta g_floodthreshold "6"
Set the number of messages per second before ignoring the client's messages.

// Only in effect when seta g_floodprotect is turned on.
// Default: 6

seta g_floodWait "1000"
Set the minimum time (in ms) between two messages when seta g_floodprotect is enabled.

// 1000 ms copies sv_floodprotect (forced to 0 in N!tmod) behaviour.'
// Default: 1000

