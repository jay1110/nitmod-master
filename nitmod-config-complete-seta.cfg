seta g_fixedphysics "0"

// Controls the physics corrections related to player frame rates. Permits to avoid rounding errors. seta g_fixedPhysicsFPS controls the FPS the added rounding error emulates.

// 0 : Disable

// 1 : Enable
// Default: 0

seta g_fixedphysicsfps "125"

// Sets the emulated FPS value when calculating the artificial rounding error used in seta g_fixedPhysics. The magic numbers to use for this setting are 76, 125, and 333, however, 125 works seems be the most used value
// Default: 125

seta g_floodprotect "1"

// Toggle flood protecting.

// Flooding means that a client is sending too many messages to the server (vsays, callvotes, etc...).

