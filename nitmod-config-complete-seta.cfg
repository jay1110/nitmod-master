//-------------------LMS Settings only-------------------//
seta g_lms_teamForceBalance "1"   //nicht getestet
// Controls whether the game will prevent new players from joining the team with more players than the other
// 0 : Disable
// 1 : Enable
// Default: 1

seta g_lms_roundlimit "3"   //nicht getestet
